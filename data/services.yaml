# Source of truth for free-services site + README
# See ROADMAP.md — README tables should mirror this file.
meta:
  updated: "2026-10-08"
  repo: "https://github.com/dereknguyen269/free-services"
  pages_url: "https://dereknguyen269.github.io/free-services/"

legend:
  - { badge: "🟢", meaning: "Free forever (no expiry)" }
  - { badge: "🔵", meaning: "Free credits (runs out)" }
  - { badge: "🟡", meaning: "Free trial (time-limited)" }
  - { badge: "💳", meaning: "Credit card required" }
  - { badge: "😴", meaning: "Sleeps / pauses when inactive" }
  - { badge: "⚡", meaning: "Usage or rate limits" }
  - { badge: "🏠", meaning: "Self-hostable" }
  - { badge: "💰", meaning: "Transaction fees" }
  - { badge: "⏳", meaning: "Not yet re-verified" }

stacks:
  - id: saas
    emoji: "🚀"
    name: "$0 SaaS Stack"
    who_for: "SaaS / startup MVP"
    components:
      - { layer: "Frontend", pick: "Cloudflare Pages (or Vercel for Next.js, non-commercial only)" }
      - { layer: "Backend", pick: "Cloudflare Workers" }
      - { layer: "Database", pick: "Neon or Supabase (Postgres)" }
      - { layer: "Auth", pick: "Better Auth or Supabase Auth" }
      - { layer: "Storage", pick: "Cloudflare R2" }
      - { layer: "Email", pick: "Resend" }
      - { layer: "Analytics", pick: "PostHog" }
      - { layer: "Monitoring", pick: "Sentry" }
      - { layer: "Payments", pick: "Stripe" }
      - { layer: "DNS / CDN", pick: "Cloudflare" }
      - { layer: "Code + CI", pick: "GitHub + GitHub Actions" }
    walls:
      - "Workers + Postgres: use Cloudflare Hyperdrive (or a pooled connection string) or you will exhaust database connections."
      - "Supabase free projects pause after about a week of inactivity. Fine for dev, risky for production."
      - "Vercel's free Hobby plan is for non-commercial use. A paying SaaS needs Pro or a different host."
      - "Resend's free plan has a daily send cap that password-reset spikes can hit."
  - id: ai
    emoji: "🤖"
    name: "$0 AI Stack"
    who_for: "AI app"
    components:
      - { layer: "Frontend", pick: "Cloudflare Pages" }
      - { layer: "Backend", pick: "Cloudflare Workers" }
      - { layer: "LLM", pick: "Gemini / Groq / Cerebras (rate-limited free tiers)" }
      - { layer: "Embeddings", pick: "Cloudflare Workers AI or Gemini" }
      - { layer: "Vector DB", pick: "Supabase pgvector (or Cloudflare Vectorize)" }
      - { layer: "Database", pick: "Supabase / Neon" }
      - { layer: "Email", pick: "Resend" }
      - { layer: "Analytics", pick: "PostHog" }
      - { layer: "Monitoring", pick: "Sentry" }
    walls:
      - "Free LLM tiers are rate-limited (requests per minute and per day) and often allow providers to use your prompts for training. Do not send sensitive user data. Add a provider fallback (e.g. Groq → Gemini → OpenRouter) before launch."
  - id: static
    emoji: "🌐"
    name: "$0 Static Site Stack"
    who_for: "Static site / docs"
    components:
      - { layer: "Hosting", pick: "Cloudflare Pages / GitHub Pages" }
      - { layer: "DNS", pick: "Cloudflare" }
      - { layer: "Analytics", pick: "Cloudflare Web Analytics / Umami Cloud" }
      - { layer: "Forms", pick: "Tally / Formspree" }
    walls:
      - "Almost nowhere. Build-minute limits are the first thing you will notice on large sites."
  - id: api
    emoji: "🔌"
    name: "$0 API Stack"
    who_for: "API / backend"
    components:
      - { layer: "Runtime", pick: "Cloudflare Workers / Render / Koyeb" }
      - { layer: "Database", pick: "Neon / Supabase" }
      - { layer: "Cache", pick: "Upstash Redis" }
      - { layer: "Monitoring", pick: "Sentry + UptimeRobot" }
      - { layer: "Email", pick: "Resend" }
    walls:
      - "Render's free web service sleeps after idle (cold starts of tens of seconds), and Workers have a CPU time limit per request. Both are fine for prototypes, not for latency-sensitive production."
  - id: mobile
    emoji: "📱"
    name: "$0 Mobile Stack"
    who_for: "Mobile app"
    components:
      - { layer: "App", pick: "Expo (React Native) or Flutter" }
      - { layer: "Backend + DB", pick: "Supabase or Firebase" }
      - { layer: "Auth", pick: "Supabase Auth / Firebase Auth" }
      - { layer: "Push", pick: "Firebase Cloud Messaging" }
      - { layer: "Storage", pick: "Supabase Storage / Cloudflare R2" }
      - { layer: "Crash reports", pick: "Sentry / Firebase Crashlytics" }
    walls:
      - "The stores, not the infrastructure. Apple Developer ($99/year) and Google Play ($25 one-time) are unavoidable for publishing."
  - id: side
    emoji: "🧑‍💻"
    name: "$0 Side Project Stack"
    who_for: "Side project — lowest setup, no card on file"
    components:
      - { layer: "Hosting", pick: "Cloudflare Pages + Workers" }
      - { layer: "Database", pick: "Turso (SQLite) or Neon" }
      - { layer: "Auth", pick: "Better Auth" }
      - { layer: "Analytics", pick: "Umami Cloud / Cloudflare Web Analytics" }
      - { layer: "Uptime", pick: "UptimeRobot" }
    walls:
      - "Optimized for lowest setup effort and no card on file, so a forgotten project cannot surprise you with a bill."
  - id: oss
    emoji: "🐙"
    name: "$0 Open Source Stack"
    who_for: "Open source project"
    components:
      - { layer: "Code + Issues", pick: "GitHub" }
      - { layer: "CI/CD", pick: "GitHub Actions (free for public repos)" }
      - { layer: "Docs", pick: "GitHub Pages / Cloudflare Pages" }
      - { layer: "Packages", pick: "npm / GitHub Packages / GHCR" }
      - { layer: "Security", pick: "GitHub code scanning + Dependabot (free for public repos)" }
      - { layer: "Dev env", pick: "GitHub Codespaces (monthly free hours)" }
      - { layer: "Community", pick: "GitHub Discussions" }
    walls:
      - "Many paid tools offer free plans for open source projects. Always check each vendor's open-source program before paying."

categories:
  - id: hosting
    emoji: "☁️"
    name: "Hosting"
    services:
      - { name: "Cloudflare Pages", url: "https://pages.cloudflare.com/", type: "Static / full-stack", free: "🟢", limits: "Unlimited bandwidth, limited builds per month", card: false, verified: "⏳" }
      - { name: "Cloudflare Workers", url: "https://workers.cloudflare.com/", type: "Serverless / edge", free: "🟢⚡", limits: "~100k requests/day, short CPU time per request", card: false, verified: "⏳" }
      - { name: "Vercel", url: "https://vercel.com/", type: "Frontend", free: "🟢⚡", limits: "Hobby plan is non-commercial only; bandwidth and function limits", card: false, verified: "⏳" }
      - { name: "Netlify", url: "https://www.netlify.com/", type: "Frontend", free: "🟢⚡", limits: "Credit-based free plan covering builds, bandwidth, functions", card: false, verified: "⏳" }
      - { name: "Render", url: "https://render.com/", type: "App hosting", free: "🟢😴", limits: "Free web services sleep when idle; free Postgres expires", card: false, verified: "⏳" }
      - { name: "Koyeb", url: "https://www.koyeb.com/", type: "Containers", free: "🟢⚡", limits: "One small free instance", card: "varies", verified: "⏳" }
      - { name: "GitHub Pages", url: "https://pages.github.com/", type: "Static", free: "🟢", limits: "Small site size cap, soft bandwidth cap, no server code", card: false, verified: "⏳" }
      - { name: "Deno Deploy", url: "https://deno.com/deploy", type: "Serverless", free: "🟢⚡", limits: "Request and bandwidth limits", card: false, verified: "⏳" }
      - { name: "Google Cloud Run", url: "https://cloud.google.com/run", type: "Containers", free: "🟢⚡💳", limits: "Monthly free request and compute allowance", card: true, verified: "⏳" }
      - { name: "Railway", url: "https://railway.com/", type: "Cloud", free: "🔵", limits: "Trial credits, then paid", card: true, verified: "⏳" }
      - { name: "Fly.io", url: "https://fly.io/", type: "Cloud", free: "🔵", limits: "Pay-as-you-go for new accounts, no standing free plan", card: true, verified: "⏳" }
  - id: databases
    emoji: "💾"
    name: "Databases"
    services:
