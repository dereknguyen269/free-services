      - { name: "Neon", url: "https://neon.tech/", type: "PostgreSQL", free: "🟢😴", limits: "~0.5 GB per project", notes: "Scales to zero, cold start on first query", verified: "⏳" }
      - { name: "Aiven", url: "https://aiven.io/", type: "PostgreSQL / MySQL / Valkey", free: "🟢⚡", limits: "Single small node", notes: "Good for learning", verified: "⏳" }
      - { name: "CockroachDB", url: "https://www.cockroachlabs.com/", type: "Distributed SQL", free: "🟢⚡", limits: "Free Basic tier with monthly usage allowance", notes: "Postgres-compatible", verified: "⏳" }
      - { name: "Nile", url: "https://www.thenile.dev/", type: "PostgreSQL", free: "🟢⚡", limits: "Free tier for multi-tenant apps", notes: "Tenant-aware Postgres", verified: "⏳" }
      - { name: "Turso", url: "https://turso.tech/", type: "SQLite (libSQL)", free: "🟢⚡", limits: "Several GB storage, monthly row read/write caps", notes: "Great with Workers", verified: "⏳" }
      - { name: "MongoDB Atlas", url: "https://www.mongodb.com/atlas", type: "MongoDB", free: "🟢⚡", limits: "M0 cluster, ~512 MB", notes: "Shared cluster, connection caps", verified: "⏳" }
      - { name: "Firebase", url: "https://firebase.google.com/", type: "Firestore / RTDB", free: "🟢⚡", limits: "Spark plan, daily read/write caps", notes: "File Storage may require the paid plan", verified: "⏳" }
